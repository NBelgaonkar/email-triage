name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes triage scripts tests
      - name: Security scan
        run: python -m bandit -q -r triage scripts
      - name: Tests (no API keys needed, all external services are faked)
        run: python -m pytest -q
